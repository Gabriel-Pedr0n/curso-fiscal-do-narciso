<style>
/* =========================================================
   1. VARIÁVEIS E BASE
   ========================================================= */
:root{
  --navy:#0b1f4d; --navy-2:#13306f; --navy-3:#1d3f8a;
  --gold:#c9a24a; --gold-2:#e0c27a; --gold-soft:#f7efd9;
  --bg:#f4f6fb; --card:#ffffff; --line:#e3e7ef;
  --text:#1b2338; --muted:#667089;
  --ok:#1e9e5a; --ok-soft:#e3f5ea;
  --lock:#9aa3b5; --lock-soft:#eef0f4;
  --err:#c0392b; --err-soft:#fbe9e7;
  --warn:#b7791f; --warn-soft:#fdf3e1;
  --radius:16px; --shadow:0 2px 6px rgba(11,31,77,.05),0 8px 24px rgba(11,31,77,.06);
  --serif:'Playfair Display',Georgia,'Times New Roman',serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --script:'Great Vibes','Brush Script MT','Segoe Script','Lucida Handwriting',cursive;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);color:var(--navy);line-height:1.25;margin:0 0 .5em}
h1{font-size:1.9rem} h2{font-size:1.4rem} h3{font-size:1.12rem}
a{color:var(--navy-3)}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:.86rem}

/* =========================================================
   2. BOTÕES, CAMPOS, CARTÕES
   ========================================================= */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;border:1px solid transparent;border-radius:10px;padding:.62em 1.1em;font-weight:600;cursor:pointer;text-decoration:none;transition:.15s;font-size:.95rem;line-height:1.2;background:#fff;border-color:var(--line);color:var(--navy)}
.btn:hover{border-color:var(--navy-3)}
.btn-primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn-primary:hover{background:var(--navy-2)}
.btn-gold{background:var(--gold);color:#fff;border-color:var(--gold)}
.btn-gold:hover{background:#b8913b}
.btn-ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn-danger{background:#fff;color:var(--err);border-color:#efc3bd}
.btn-danger:hover{background:var(--err-soft);border-color:var(--err)}
.btn-ghost{background:transparent;border-color:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-sm{padding:.4em .8em;font-size:.85rem}
.btn-row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
label{font-weight:600;font-size:.9rem;display:block;margin-bottom:.3em;color:var(--navy)}
.field{margin-bottom:1rem}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);border-radius:10px;padding:.65em .8em;background:#fff;outline:none;transition:.15s}
.input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,74,.18)}
textarea.input{resize:vertical;min-height:110px}
.input.invalid{border-color:var(--err)}
.hint{font-size:.82rem;color:var(--muted);margin-top:.25em}
.error-text{color:var(--err);font-size:.85rem;margin-top:.3em}
.check{display:flex;gap:.6em;align-items:flex-start;cursor:pointer;font-weight:500;color:var(--text)}
.check input{width:18px;height:18px;margin-top:.2em;accent-color:var(--ok);flex:none;cursor:pointer}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:1.5rem;margin-bottom:1.25rem;border:1px solid rgba(11,31,77,.04)}
.card-title{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:.8rem}
.card-title h2,.card-title h3{margin:0}
.grid{display:grid;gap:1.25rem}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.tag{display:inline-flex;align-items:center;gap:.3em;font-size:.75rem;font-weight:600;padding:.2em .65em;border-radius:99px;background:var(--gold-soft);color:#8a6a1e;white-space:nowrap}
.tag-navy{background:#e7ecf7;color:var(--navy)}
.tag-ok{background:var(--ok-soft);color:var(--ok)}
.tag-lock{background:var(--lock-soft);color:#6f7889}
.tag-gold{background:var(--gold-soft);color:#8a6a1e}
.bar{height:8px;background:#e9ecf3;border-radius:99px;overflow:hidden}
.bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-2));border-radius:99px;transition:width .4s}
.bar.ok>span{background:var(--ok)}
.alert{border-radius:12px;padding:.85rem 1rem;margin-bottom:1rem;font-size:.92rem;border:1px solid}
.alert-info{background:#eef3fc;border-color:#d3def5;color:var(--navy)}
.alert-warn{background:var(--warn-soft);border-color:#f0d9a8;color:#7a5410}
.alert-err{background:var(--err-soft);border-color:#f2c4be;color:#8b2a1f}
.alert-ok{background:var(--ok-soft);border-color:#bfe5cd;color:#16683c}
.alert ul{margin:.4em 0 0;padding-left:1.2em}

/* =========================================================
   3. LOGIN
   ========================================================= */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;background:radial-gradient(circle at 15% 10%,#1d3f8a 0,transparent 45%),linear-gradient(160deg,var(--navy),#071433)}

.tabs button{flex:1;border:0;background:transparent;padding:.6em;border-radius:9px;font-weight:600;cursor:pointer;color:var(--muted)}
.tabs button.active{background:#fff;color:var(--navy);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.login-foot{margin-top:1.3rem;padding-top:1.1rem;border-top:1px solid var(--line);text-align:center}

/* =========================================================
   4. ESTRUTURA DO APP (menu lateral + barra superior)
   ========================================================= */
#app{display:flex;min-height:100vh}
.sidebar{width:260px;background:var(--navy);color:#cfd7ea;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:40;transition:transform .25s}
.sidebar .brand{padding:1.4rem 1.3rem .6rem;margin:0}
.sidebar .brand-name{color:#fff;font-size:2.1rem}
.sidebar .brand-sub{font-size:.88rem}
.sidebar .brand-sub{color:#93a1c4}
.nav{padding:.8rem .7rem;flex:1;overflow-y:auto}
.nav a{display:flex;align-items:center;gap:.75rem;padding:.7rem .85rem;border-radius:10px;color:#cfd7ea;text-decoration:none;font-weight:500;margin-bottom:2px;transition:.15s}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.active{background:rgba(201,162,74,.16);color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.nav a svg{width:19px;height:19px;flex:none;opacity:.9}
.nav .sep{height:1px;background:rgba(255,255,255,.09);margin:.7rem .5rem}
.side-user{padding:1rem 1.3rem;border-top:1px solid rgba(255,255,255,.08);font-size:.85rem;color:#93a1c4}
.side-user b{color:#fff;display:block;font-weight:600}
.main{flex:1;margin-left:260px;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:.75rem 1.8rem;display:flex;align-items:center;gap:1.2rem}
.topbar .menu-btn{display:none;border:0;background:transparent;padding:.3rem;cursor:pointer;color:var(--navy)}
.top-block{min-width:0;flex:1}
.top-block small{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.top-block strong{font-family:var(--serif);color:var(--navy);font-size:1.05rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-progress{width:260px;flex:none}
.top-progress .lbl{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin-bottom:.3rem;font-weight:600}
.content{padding:1.8rem;max-width:1120px;width:100%;margin:0 auto}
.overlay{display:none;position:fixed;inset:0;background:rgba(7,20,51,.45);z-index:35}
.page-head{margin-bottom:1.4rem}
.page-head p{margin:0;color:var(--muted)}

/* =========================================================
   5. PAINEL
   ========================================================= */
.hero{background:linear-gradient(135deg,var(--navy),var(--navy-3));color:#fff;border-radius:20px;padding:1.8rem 2rem;margin-bottom:1.25rem;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:28px solid rgba(201,162,74,.22)}
.hero h1{color:#fff;margin-bottom:.2rem}
.hero p{margin:0;color:#c8d2ea}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1rem;margin-bottom:1.25rem}
.stat{background:#fff;border-radius:14px;padding:1rem 1.1rem;box-shadow:var(--shadow)}
.stat .v{font-family:var(--serif);font-size:1.7rem;font-weight:700;color:var(--navy);line-height:1.1}
.stat .l{font-size:.8rem;color:var(--muted);font-weight:500}
.next-card{display:flex;gap:1.2rem;align-items:center;justify-content:space-between;flex-wrap:wrap}
.disc-row{display:grid;grid-template-columns:52px 1fr 90px;gap:.8rem;align-items:center;padding:.45rem 0;border-bottom:1px dashed var(--line);font-size:.9rem}
.disc-row:last-child{border-bottom:0}
.disc-row .code{font-weight:700;color:var(--navy);font-size:.8rem}
.disc-row .name{min-width:0}
.disc-row .name div:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.disc-row .num{text-align:right;color:var(--muted);font-size:.82rem}

/* =========================================================
   6. CURSO (blocos e aulas)
   ========================================================= */
.block-card .bhead{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:flex-start;margin-bottom:1rem}
.item{display:flex;align-items:center;gap:.9rem;padding:.8rem .9rem;border-radius:12px;border:1px solid var(--line);margin-bottom:.55rem;background:#fff;transition:.15s}
.item:hover{border-color:#cfd6e4}
.item.locked{background:#fafbfc;color:#8d95a6}
.item.done{border-color:#cfe9d9}
.item.open{border-color:#ecdcb3;background:#fffdf7}
.st{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.st svg{width:17px;height:17px}
.st-done{background:var(--ok);color:#fff}
.st-open{background:var(--gold);color:#fff}
.st-lock{background:var(--lock-soft);color:var(--lock)}
.item .info{flex:1;min-width:0}
.item .t{font-weight:600;color:var(--navy)}
.item.locked .t{color:#7d8597}
.item .m{font-size:.8rem;color:var(--muted);display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.legend{display:flex;gap:1rem;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin-bottom:1rem}
.legend span{display:inline-flex;align-items:center;gap:.35rem}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}

/* =========================================================
   7. AULA
   ========================================================= */
.lesson-head{border-top:4px solid var(--gold)}
.meta{display:flex;flex-wrap:wrap;gap:.5rem 1.2rem;color:var(--muted);font-size:.88rem;margin-top:.6rem}
.meta b{color:var(--text);font-weight:600}
.roteiro{display:flex;gap:6px;margin-top:.4rem;flex-wrap:wrap}
.roteiro .r{flex:1 1 120px;background:var(--gold-soft);border-radius:10px;padding:.6rem .8rem;font-size:.88rem}
.roteiro .r b{display:block;color:#8a6a1e;font-size:.78rem}
.sec h3{display:flex;align-items:center;gap:.5rem}
.sec h3 .ic{width:28px;height:28px;border-radius:8px;background:#e7ecf7;color:var(--navy);display:inline-flex;align-items:center;justify-content:center;font-size:.85rem;font-family:var(--sans)}
.sec.warn h3 .ic{background:var(--warn-soft);color:var(--warn)}
.sec.office h3 .ic{background:var(--gold-soft);color:#8a6a1e}
.notebook{background:linear-gradient(#fffdf6,#fffdf6) padding-box;border:2px dashed #e2cf9b}
.notebook .check{padding:.45rem 0;border-bottom:1px dashed #efe3c2}
.notebook .check:last-child{border-bottom:0}
.check.done-line span{text-decoration:line-through;color:var(--muted)}
.video-box{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;background:#f7f9fd;border-radius:12px;padding:1rem}
.video-ic{width:52px;height:52px;border-radius:12px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.save-ind{font-size:.8rem;color:var(--muted)}
.lesson-nav{display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap;align-items:center}

/* Texto formatado (vindo do JSON) */
.md p{margin:.2em 0 .8em}
.md h1,.md h2,.md h3,.md h4{font-family:var(--serif);color:var(--navy);margin:1em 0 .4em}
.md h1{font-size:1.3rem}.md h2{font-size:1.18rem}.md h3{font-size:1.05rem}.md h4{font-size:1rem}
.md ul,.md ol{margin:.2em 0 .9em;padding-left:1.4em}
.md li{margin:.2em 0}
.md code{background:#eef1f7;padding:.1em .35em;border-radius:5px;font-size:.88em;font-family:ui-monospace,Consolas,monospace}
.md pre{background:#0f1c3d;color:#e8ecf6;padding:1rem;border-radius:10px;overflow:auto;font-size:.85rem}
.md pre code{background:transparent;padding:0;color:inherit}
.md table{border-collapse:collapse;width:100%;margin:.4em 0 1em;font-size:.9rem;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--line);padding:.45em .7em;text-align:left;vertical-align:top}
.md th{background:#f1f4fa;color:var(--navy);font-weight:600}
.md blockquote{margin:.4em 0 1em;padding:.5em 1em;border-left:3px solid var(--gold);background:#fffaf0}

/* =========================================================
   8. EXERCÍCIOS
   ========================================================= */
.q{border:1px solid var(--line);border-radius:14px;padding:1.2rem;margin-bottom:1rem;background:#fff}
.q.right{border-color:#9ed6b4;background:#f6fcf8}
.q.wrong{border-color:#efb5ad;background:#fef8f7}
.q.partial{border-color:#ecd292;background:#fffbf1}
.q-head{display:flex;gap:.6rem;align-items:center;margin-bottom:.6rem;flex-wrap:wrap}
.q-num{width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex:none}
.opt{display:flex;gap:.7rem;align-items:flex-start;padding:.6rem .8rem;border:1px solid var(--line);border-radius:10px;margin-bottom:.45rem;cursor:pointer;background:#fff}
.opt input{margin-top:.25em;accent-color:var(--navy)}
.opt.is-correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.is-wrong{border-color:var(--err);background:var(--err-soft)}
.feedback{margin-top:.8rem;padding:.8rem 1rem;border-radius:10px;background:#f6f8fc;font-size:.92rem}
.feedback b.ok{color:var(--ok)} .feedback b.no{color:var(--err)} .feedback b.mid{color:var(--warn)}
.calc-wrap{display:flex;gap:.5rem;align-items:center;max-width:320px}
.calc-wrap .unit{font-weight:600;color:var(--muted)}
.score{display:flex;align-items:center;gap:1.2rem;flex-wrap:wrap}
.score .big{font-family:var(--serif);font-size:2.6rem;font-weight:800;color:var(--navy);line-height:1}
table.simple{width:100%;border-collapse:collapse;font-size:.9rem}
table.simple th,table.simple td{padding:.55rem .6rem;border-bottom:1px solid var(--line);text-align:left}
table.simple th{color:var(--muted);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em}

/* =========================================================
   9. CERTIFICADO (mesmo desenho na tela e na impressão)
   ========================================================= */
.cert-wrap{width:100%;overflow:hidden;border-radius:8px;box-shadow:0 6px 30px rgba(11,31,77,.18);background:#fff;margin-bottom:1.2rem}
.cert-scale{transform-origin:top left}
.cert-page{width:297mm;height:210mm;position:relative;background:#fff;overflow:hidden;color:#1b2338;font-family:var(--sans);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cert-frame{position:absolute;inset:7mm;border:2.6mm solid var(--navy)}
.cert-frame:after{content:"";position:absolute;inset:2.2mm;border:.4mm solid var(--gold)}
.cert-wave{position:absolute;width:118mm;height:78mm;pointer-events:none}
.cert-wave.tr{top:0;right:0}
.cert-wave.bl{bottom:0;left:0;transform:rotate(180deg)}
.cert-seal{position:absolute;top:15mm;left:19mm;width:36mm;height:48mm}
.cert-body{position:absolute;inset:20mm 30mm 15mm;display:flex;flex-direction:column;align-items:center;text-align:center}
.cert-title{font-family:var(--serif);font-weight:800;font-size:44pt;color:var(--navy);letter-spacing:.02em;line-height:1;margin-top:4mm}
.cert-sub{font-family:var(--serif);font-size:15pt;color:var(--gold);letter-spacing:.18em;text-transform:uppercase;margin-top:2.5mm;font-weight:600}
.cert-atesta{font-size:11.5pt;color:#4a5470;margin-top:7mm;letter-spacing:.04em}
.cert-name{font-family:var(--script);font-size:40pt;color:#b08a33;line-height:1.15;margin-top:2mm;padding:0 6mm 1mm;min-width:150mm;border-bottom:.5mm solid var(--gold);white-space:nowrap}
.cert-cpf{font-size:9.5pt;color:#4a5470;margin-top:1.5mm}
.cert-text{font-size:11pt;line-height:1.6;max-width:205mm;margin-top:4mm;color:#2b3450}
.cert-text b{color:var(--navy)}
.cert-sign{margin-top:auto;display:flex;flex-direction:column;align-items:center;margin-bottom:9mm}
.cert-sign .line{width:80mm;border-top:.35mm solid #1b2338;margin-bottom:1.5mm}
.cert-sign .nm{font-weight:600;font-size:10.5pt;color:var(--navy)}
.cert-sign .rl{font-size:8.5pt;color:#667089}
.cert-foot{position:absolute;left:92mm;right:18mm;bottom:12.5mm;z-index:2;display:flex;justify-content:space-between;align-items:flex-end;gap:8mm;font-size:7.2pt;color:#667089;line-height:1.45}
.cert-foot .note{max-width:125mm;text-align:left}
.cert-foot .code{text-align:right;white-space:nowrap}
.cert-foot .code b{color:var(--navy);font-size:8.5pt;letter-spacing:.06em}
.cert-water{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:5}
.cert-water span{font-family:var(--serif);font-weight:800;font-size:120pt;color:rgba(192,57,43,.13);transform:rotate(-22deg);letter-spacing:.1em}
/* Página 2 */
.hist-body{position:absolute;inset:19mm 24mm 16mm;display:flex;flex-direction:column}
.hist-title{font-family:var(--serif);font-weight:800;font-size:24pt;color:var(--navy);text-align:center}
.hist-sub{text-align:center;color:#667089;font-size:9.5pt;margin-bottom:4mm}
.hist-cols{display:grid;grid-template-columns:1.45fr 1fr;gap:8mm;flex:1;min-height:0}
.hist-table{width:100%;border-collapse:collapse;font-size:8.4pt}
.hist-table th{background:var(--navy);color:#fff;font-weight:600;padding:1.4mm 2mm;text-align:left;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.hist-table td{padding:1.05mm 2mm;border-bottom:.25mm solid #e3e7ef}
.hist-table td.n,.hist-table th.n{text-align:right;white-space:nowrap}
.hist-table tr.tot td{font-weight:700;color:var(--navy);border-top:.5mm solid var(--gold);border-bottom:0}
.hist-comp h4{font-family:var(--serif);color:var(--navy);font-size:12pt;margin:0 0 2mm}
.hist-comp ul{margin:0;padding-left:4.5mm;font-size:8.3pt;line-height:1.45;color:#2b3450}
.hist-comp li{margin-bottom:.8mm}

/* =========================================================
   10. AVISOS (toast) E JANELAS (modal)
   ========================================================= */
#toasts{position:fixed;right:1.2rem;bottom:1.2rem;z-index:100;display:flex;flex-direction:column;gap:.6rem;max-width:min(380px,calc(100vw - 2.4rem))}
.toast{background:var(--navy);color:#fff;padding:.85rem 1.1rem;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:.92rem;border-left:4px solid var(--gold);animation:tin .25s ease}
.toast.ok{border-left-color:#4cd08a}
.toast.err{border-left-color:#ff7a6b}
@keyframes tin{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.modal-bg{position:fixed;inset:0;background:rgba(7,20,51,.55);z-index:90;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal{background:#fff;border-radius:18px;max-width:460px;width:100%;padding:1.6rem;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal p{margin:.3em 0 1em;color:#3b4560}
.modal .btn-row{justify-content:flex-end;margin-top:1rem}

/* =========================================================
   11. CELULAR
   ========================================================= */
@media (max-width:1000px){
  .stats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .top-progress{width:180px}
}
@media (max-width:820px){
  .sidebar{transform:translateX(-100%)}
  body.menu-open .sidebar{transform:none}
  body.menu-open .overlay{display:block}
  .main{margin-left:0}
  .topbar{padding:.65rem 1rem;gap:.7rem}
  .topbar .menu-btn{display:block}
  .top-progress{width:110px}
  .content{padding:1.1rem}
  .grid-2,.grid-3{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card{padding:1.15rem}
  .hero{padding:1.4rem}
  h1{font-size:1.55rem}
  .item{flex-wrap:wrap;gap:.6rem .8rem}
  .item .info{flex:1 1 calc(100% - 50px)}
  .item>.btn,.item>.tag{margin-left:46px}
  .top-progress .lbl span:first-child{display:none}
  .top-progress .lbl{justify-content:flex-end}
  .top-block strong{font-size:.95rem}
  .block-card .bhead>div:last-child{width:100%}
}


/* =========================================================
   13. ANIMAÇÕES E MICROINTERAÇÕES (UX)
   ========================================================= */
@keyframes entrar{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes surgir{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}
@keyframes brilho{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes pulso{0%{box-shadow:0 0 0 0 rgba(201,162,74,.55)}70%{box-shadow:0 0 0 12px rgba(201,162,74,0)}100%{box-shadow:0 0 0 0 rgba(201,162,74,0)}}
@keyframes flutuar{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-4px) rotate(2deg)}}
@keyframes confete{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
@keyframes barra{from{width:0}}
.anim>*{animation:entrar .45s cubic-bezier(.2,.7,.2,1) both}
.anim>*:nth-child(2){animation-delay:.05s}.anim>*:nth-child(3){animation-delay:.1s}.anim>*:nth-child(4){animation-delay:.15s}
.anim>*:nth-child(5){animation-delay:.2s}.anim>*:nth-child(6){animation-delay:.25s}.anim>*:nth-child(n+7){animation-delay:.3s}
.stats .stat{animation:surgir .4s cubic-bezier(.2,.7,.2,1) both}
.stats .stat:nth-child(2){animation-delay:.06s}.stats .stat:nth-child(3){animation-delay:.12s}.stats .stat:nth-child(4){animation-delay:.18s}.stats .stat:nth-child(5){animation-delay:.24s}.stats .stat:nth-child(6){animation-delay:.3s}
.bar>span{animation:barra .9s cubic-bezier(.2,.7,.2,1) both}
.btn{transition:transform .12s, box-shadow .2s, background .2s, border-color .2s}
.btn:not([disabled]):hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(11,31,77,.12)}
.btn:not([disabled]):active{transform:translateY(0) scale(.97);box-shadow:none}
.btn-gold:not([disabled]){background-image:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);background-size:200% 100%}
.btn-gold:not([disabled]):hover{animation:brilho 1.2s linear}
.card,.stat,.item{transition:transform .2s, box-shadow .2s, border-color .2s}
@media (hover:hover){ .stat:hover,.item:not(.locked):hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(11,31,77,.1)} }
.st-open{animation:pulso 2.2s infinite}
.check input:checked{animation:pop .3s ease}
.opt{transition:background .15s,border-color .15s,transform .12s}
.opt:hover{border-color:var(--gold)}
.opt:has(input:checked){border-color:var(--navy);background:#f1f4fb}
.opt:active{transform:scale(.99)}
.modal-bg{animation:entrar .2s ease both}
.modal{animation:surgir .25s cubic-bezier(.2,.7,.2,1) both}
.toast{animation:tin .35s cubic-bezier(.2,.7,.2,1)}
.brand-logo{transition:transform .3s}
.brand:hover .brand-logo{animation:flutuar 1.6s ease-in-out infinite}
.nav a{transition:background .15s,color .15s,padding .15s}
.nav a:hover{padding-left:1.05rem}
.q{animation:entrar .4s both}
.score .big{animation:pop .6s ease}
.confete{position:fixed;width:9px;height:14px;border-radius:2px;pointer-events:none;z-index:120;animation:confete 1.3s cubic-bezier(.15,.6,.3,1) forwards}
.streak{display:inline-flex;align-items:center;gap:.35rem;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:.35rem .8rem;border-radius:99px;font-size:.85rem;font-weight:600;color:#fff;margin-top:.9rem}
.topo-btn{position:fixed;right:1.1rem;bottom:1.2rem;width:44px;height:44px;border-radius:50%;border:0;background:var(--navy);color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer;z-index:45;opacity:0;pointer-events:none;transform:translateY(10px);transition:.25s;display:flex;align-items:center;justify-content:center}
.topo-btn.ver{opacity:1;pointer-events:auto;transform:none}
.tabela-dica{display:none;font-size:.75rem;color:var(--muted);margin:-.6rem 0 .8rem}

/* Barra de navegação inferior (celular) */
.bottom-nav{display:none}
@media (max-width:820px){
  .bottom-nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:38;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:.35rem .3rem calc(.35rem + env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(11,31,77,.06)}
  .bottom-nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:.35rem 0;font-size:.68rem;font-weight:600;color:var(--muted);text-decoration:none;border-radius:10px;transition:color .15s,background .15s}
  .bottom-nav a svg{width:22px;height:22px;transition:transform .2s}
  .bottom-nav a.active{color:var(--navy);background:var(--gold-soft)}
  .bottom-nav a.active svg{transform:translateY(-1px) scale(1.08)}
  .content{padding-bottom:calc(5.5rem + env(safe-area-inset-bottom))}
  #toasts{bottom:calc(5rem + env(safe-area-inset-bottom));right:.8rem;left:.8rem;max-width:none}
  .topo-btn{bottom:calc(5rem + env(safe-area-inset-bottom))}

// Janela de confirmação. opts: {titulo, texto, ok, cancelar, perigo, digitar}
function confirmar(opts){
  return new Promise(res=>{
    const bg=document.createElement('div'); bg.className='modal-bg';
    bg.innerHTML=`<div class="modal" role="dialog" aria-modal="true">
      <h3>${esc(opts.titulo||'Confirmar')}</h3><p>${esc(opts.texto||'')}</p>
      ${opts.digitar?`<div class="field"><label>Para confirmar, digite <b>${esc(opts.digitar)}</b></label><input class="input" id="m-in" autocomplete="off"></div>`:''}
      <div class="btn-row">
        ${opts.cancelar===false?'':`<button class="btn" data-r="0">${esc(opts.cancelar||'Cancelar')}</button>`}
        <button class="btn ${opts.perigo?'btn-danger':'btn-primary'}" data-r="1">${esc(opts.ok||'Confirmar')}</button>
      </div></div>`;
    document.body.appendChild(bg);
    const fechar=v=>{bg.remove();res(v);};
    bg.addEventListener('click',e=>{
      const b=e.target.closest('[data-r]'); if(!b){ if(e.target===bg) fechar(false); return; }
      if(b.dataset.r==='1' && opts.digitar){ const v=$('#m-in',bg).value.trim(); if(v.toUpperCase()!==opts.digitar.toUpperCase()){ $('#m-in',bg).classList.add('invalid'); return; } }
      fechar(b.dataset.r==='1');
    });
    setTimeout(()=>{ const i=$('#m-in',bg)||$('[data-r="1"]',bg); i&&i.focus(); },30);
  });
}

/* ---------- 4. FORMATAÇÃO SIMPLES SEGURA (títulos, listas, negrito, código, tabelas) ---------- */
function inlineMd(s){
  // s já vem escapado. Protege trechos de código primeiro.
  const codes=[]; s=s.replace(/`([^`]+)`/g,(m,c)=>{codes.push(c);return '\u0000'+(codes.length-1)+'\u0000';});
  s=s.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g,(m,t,u)=>{codes.push('\u0002'+u+'\u0003'+t);return '\u0000'+(codes.length-1)+'\u0000';});
  s=s.replace(/==([^=\n]+)==/g,'<mark>$1</mark>');
  s=s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,(m,a,u)=>{codes.push('\u0001'+u);return a+'\u0000'+(codes.length-1)+'\u0000';});
  s=s.replace(/\*\*(\S(?:[^*]*?\S)?)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/(^|[^*\w])\*(\S(?:[^*]*?\S)?)\*(?!\*)/g,'$1<em>$2</em>');
  s=s.replace(/\u0000(\d+)\u0000/g,(m,i)=>{ const c=codes[+i]; if(c[0]==='\u0001'){ const u=c.slice(1); return '<a href="'+u+'" target="_blank" rel="noopener noreferrer">'+u+'</a>'; } if(c[0]==='\u0002'){ const [u,t]=c.slice(1).split('\u0003'); return '<a href="'+u+'" target="_blank" rel="noopener noreferrer">'+t+'</a>'; } return '<code>'+c+'</code>'; });
  return s;
}
let MD_FOTOS=null;   // fotos disponíveis para ![legenda](foto:N) durante a renderização de um tutorial
function mdFotos(src, fotos){ MD_FOTOS=fotos||null; try{ return md(src); } finally{ MD_FOTOS=null; } }
function md(src){
  if(src==null) return '';
  if(Array.isArray(src)) src=src.join('\n');
  const lines=esc(String(src)).replace(/\r\n?/g,'\n').split('\n');
  let out='', i=0, para=[];
  const flush=()=>{ if(para.length){ out+='<p>'+inlineMd(para.join('<br>'))+'</p>'; para=[]; } };
  while(i<lines.length){
    const l=lines[i], t=l.trim();
    if(t.startsWith('```')){ flush(); const buf=[]; i++; while(i<lines.length && !lines[i].trim().startsWith('```')){buf.push(lines[i]);i++;} i++; out+='<pre><code>'+buf.join('\n')+'</code></pre>'; continue; }
    if(!t){ flush(); i++; continue; }
    let m;
    if((m=/^(#{1,4})\s+(.*)$/.exec(t))){ flush(); const n=Math.min(m[1].length+1,4); out+=`<h${n}>${inlineMd(m[2])}</h${n}>`; i++; continue; }
    if(t.startsWith('|') && i+1<lines.length && /^\|?\s*:?-{2,}/.test(lines[i+1].trim())){
      flush(); const cells=r=>r.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>inlineMd(c.trim()));
      const head=cells(t); i+=2; let rows='';
      while(i<lines.length && lines[i].trim().startsWith('|')){ rows+='<tr>'+cells(lines[i]).map(c=>'<td>'+c+'</td>').join('')+'</tr>'; i++; }
      out+='<div class="tabela-dica">↔ Arraste a tabela para o lado para ver tudo</div><table><thead><tr>'+head.map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>'+rows+'</tbody></table>'; continue;
    }
    if(/^[-*•]\s+/.test(t)){ flush(); let items=''; while(i<lines.length && /^[-*•]\s+/.test(lines[i].trim())){ items+='<li>'+inlineMd(lines[i].trim().replace(/^[-*•]\s+/,''))+'</li>'; i++; } out+='<ul>'+items+'</ul>'; continue; }
    if(/^\d+[.)]\s+/.test(t)){ flush(); let items=''; while(i<lines.length && /^\d+[.)]\s+/.test(lines[i].trim())){ items+='<li>'+inlineMd(lines[i].trim().replace(/^\d+[.)]\s+/,''))+'</li>'; i++; } out+='<ol>'+items+'</ol>'; continue; }
    if(/^(-{3,}|\*{3,}|_{3,})$/.test(t)){ flush(); out+='<hr>'; i++; continue; }
    { const fm=/^!\[([^\]]*)\]\(foto:(\d+)\)$/.exec(t);
      if(fm){ flush(); const f=MD_FOTOS&&MD_FOTOS[+fm[2]-1];
        if(f&&/^data:image\/(webp|jpeg|png);base64,/.test(f.src)) out+=`<figure class="foto-inline" data-action="ampliar-foto" data-n="${+fm[2]-1}"><img src="${f.src}" alt="${fm[1]}" loading="lazy">${fm[1]?`<figcaption>${fm[1]}</figcaption>`:''}</figure>`;
        else out+=`<p class="muted small">[foto ${fm[2]} não encontrada]</p>`;
        i++; continue; } }
    if(/^&gt;\s?/.test(t)){ flush(); let q=[]; while(i<lines.length && /^&gt;\s?/.test(lines[i].trim())){ q.push(lines[i].trim().replace(/^&gt;\s?/,'')); i++; } out+='<blockquote>'+inlineMd(q.join('<br>'))+'</blockquote>'; continue; }
    para.push(t); i++;
  }
  flush(); return out;
}

/* ---------- 5. UTILITÁRIO DE HASH (usado no código de verificação do certificado) ---------- */
async function sha256Hex(txt){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
}

  if(c==='email_not_confirmed' || m.includes('not confirmed')) return 'Falta confirmar seu e-mail. Abra o e-mail que enviamos e clique no link.';

  setSync(e&&e.rede?'off':'erro');
}
// Ao abrir o sistema (e ao voltar para a aba): confere se a nuvem tem algo mais novo
async function sincronizarAoAbrir(forcar){
  if(!S.user||enviando) return; if(!forcar && Date.now()-ultimoPull<20000) return; ultimoPull=Date.now();
  const uid=S.user;
  try{
    try{ const antes=JSON.stringify([S.admin,Object.keys(S.blocos).sort(),S.certGeral]); await carregarConteudo(); if(S.user!==uid) return;
      const dep=JSON.stringify([S.admin,Object.keys(S.blocos).sort(),S.certGeral]); if(antes!==dep && document.activeElement.tagName!=='TEXTAREA') render(); }catch(e){ if(e&&e.sessaoMorta) throw e; }
    const r=await daNuvem(await nuvemLer()); if(S.user!==uid) return;
    if(r && !r.perfil) r.perfil=S.d.perfil;          // perfil ilegível ou ausente: mantém o deste aparelho
    const sujo=localStorage.getItem(kSujo(uid))==='1';
    if(!r){ agendarEnvio(); return; }
    const rd=normalizar(r), tr=rd.atualizadoEm||'', tl=S.d.atualizadoEm||'';
    if(sujo && tl>=tr){ agendarEnvio(); return; }            // o que está aqui é mais novo: envia
    if(tr>tl){                                                  // a nuvem é mais nova (outro aparelho)
      const a=document.activeElement; if(a && /^(TEXTAREA|INPUT)$/.test(a.tagName)) return;
      S.d=rd; S.tentativa=null; localStorage.setItem(kDados(uid),JSON.stringify(rd)); localStorage.removeItem(kSujo(uid)); setSync('ok'); render(); toast('Seus dados foram atualizados com a versão da nuvem.'); return;
    }
    if(sujo) agendarEnvio(); else setSync('ok');
  }catch(e){ tratarErroSync(e); }
}

/* ---------- 6b. CRIPTOGRAFIA DO PERFIL (ponta a ponta) ----------
   Nome, CPF, nascimento, cidade e UF são cifrados NO APARELHO (AES-GCM 256) antes de ir para a nuvem.
   A chave de cada usuário é aleatória e fica guardada na nuvem "trancada" com a senha dele (PBKDF2 310 mil voltas).
   Assim, nem quem administra o servidor consegue ler esses dados. */
const kChave = u => 'cursoFiscal.chave.'+u;
const PB_ITER = 310000;
const enc = new TextEncoder(), dec = new TextDecoder();
async function derivarKEK(senha, saltB64, iter){
  const base = await crypto.subtle.importKey('raw', enc.encode(senha), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:unb64(saltB64), iterations:iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
const novaChave = () => crypto.subtle.generateKey({name:'AES-GCM', length:256}, true, ['encrypt','decrypt']);
async function embrulharChave(dek, senha){
  const salt=b64(crypto.getRandomValues(new Uint8Array(16))), iv=crypto.getRandomValues(new Uint8Array(12));
  const kek=await derivarKEK(senha, salt, PB_ITER), raw=await crypto.subtle.exportKey('raw', dek);
  return {v:1, salt, iter:PB_ITER, iv:b64(iv), ct:b64(await crypto.subtle.encrypt({name:'AES-GCM', iv}, kek, raw))};
}
async function desembrulharChave(w, senha){
  const kek=await derivarKEK(senha, w.salt, w.iter||PB_ITER);
  const raw=await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(w.iv)}, kek, unb64(w.ct));
  return crypto.subtle.importKey('raw', raw, {name:'AES-GCM'}, true, ['encrypt','decrypt']);
}
async function guardarChaveLocal(uid, dek){ localStorage.setItem(kChave(uid), JSON.stringify(await crypto.subtle.exportKey('jwk', dek))); }
async function lerChaveLocal(uid){ try{ const j=JSON.parse(localStorage.getItem(kChave(uid))); return j? await crypto.subtle.importKey('jwk', j, {name:'AES-GCM'}, true, ['encrypt','decrypt']) : null; }catch(e){ return null; } }
async function cifrarObj(obj){ const iv=crypto.getRandomValues(new Uint8Array(12)); return {v:1, iv:b64(iv), ct:b64(await crypto.subtle.encrypt({name:'AES-GCM', iv}, S.dek, enc.encode(JSON.stringify(obj))))}; }
async function decifrarObj(c){ return JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(c.iv)}, S.dek, unb64(c.ct)))); }
// Prepara os dados para a nuvem: o perfil sai em texto e entra cifrado
async function paraNuvem(d){
  if(!S.dek) throw {semChave:true};
  const c=JSON.parse(JSON.stringify(d)); c.perfilCifrado=await cifrarObj(c.perfil||{}); delete c.perfil;
  if(S.chaveCifrada) c.chave=S.chaveCifrada; return c;
}
// Lê da nuvem: decifra o perfil
async function daNuvem(r){
  if(!r) return null; const d=JSON.parse(JSON.stringify(r)); const chave=d.chave; delete d.chave;
  if(d.perfilCifrado){ try{ d.perfil=await decifrarObj(d.perfilCifrado); }catch(e){ d.perfil=null; d._perfilIlegivel=true; } delete d.perfilCifrado; }
  if(chave && !S.chaveCifrada) S.chaveCifrada=chave;
  return d;
}
// Destrava (ou cria) a chave do usuário no login. senha pode faltar (sessão já aberta neste aparelho).
async function prepararChave(uid, remotaRaw, senha){
  const embrulhada = remotaRaw && remotaRaw.chave, local = await lerChaveLocal(uid);
  let dek=null, perdeu=false, reembrulhar=false;
  if(embrulhada && senha){ try{ dek=await desembrulharChave(embrulhada, senha); }catch(e){ dek=local; reembrulhar=true; if(!dek){ perdeu=!!(remotaRaw.perfilCifrado); } } }
  else if(embrulhada){ dek=local; if(!dek) throw {precisaSenha:true}; }
  else { dek=local; reembrulhar=true; }
  if(!dek){ dek=await novaChave(); reembrulhar=true; }
  S.dek=dek; await guardarChaveLocal(uid, dek);
  S.chaveCifrada = embrulhada || null;
  if(reembrulhar && senha) S.chaveCifrada=await embrulharChave(dek, senha);
  return {perdeu, mudou: reembrulhar && !!senha};
}

/* ---------- 7. MODELO DO CURSO (ordem, liberação, estatísticas) ---------- */
// Monta a sequência do curso: blocos por data de início, aulas por dia
function curso(){
  const blocos = Object.values(S.blocos).slice().sort((a,b)=> a.bloco.id.localeCompare(b.bloco.id, 'pt-BR', {numeric:true}));
  const aulas=[], listas=[];
  for(const b of blocos){
    b._aulas = b.aulas.slice().sort((x,y)=>(x.dia-y.dia)||x.id.localeCompare(y.id,'pt-BR',{numeric:true}));
    for(const a of b._aulas){ a._bloco=b.bloco.id; a._idx=aulas.length; aulas.push(a); }
    for(const l of b.listas){ l._bloco=b.bloco.id; listas.push(l); }
  }
  return {blocos, aulas, listas};
}
const P = () => S.d.progresso;
const aulaFeita = id => !!P().aulas[id];
function aulaLiberada(C, a){ for(let i=0;i<a._idx;i++) if(!aulaFeita(C.aulas[i].id)) return false; return true; }
function listaLiberada(C, l){ const b=C.blocos.find(x=>x.bloco.id===l._bloco); return !!b && b.aulas.every(a=>aulaFeita(a.id)); }
const listaReg = id => P().listas[id];
const listaFeita = id => { const r=listaReg(id); return !!(r && r.tentativas && r.tentativas.length); };
const melhorPct = id => { const r=listaReg(id); return (r&&r.tentativas&&r.tentativas.length)? Math.max(...r.tentativas.map(t=>t.pct)) : null; };
function blocoCompleto(b){ return b.aulas.every(a=>aulaFeita(a.id)) && b.listas.every(l=>listaFeita(l.id)); }
function blocoAtual(C){ return C.blocos.find(b=>!blocoCompleto(b)) || C.blocos[C.blocos.length-1] || null; }
function proximoItem(C){
  for(const b of C.blocos){
    for(const a of b._aulas) if(!aulaFeita(a.id)) return {tipo:'aula', item:a, bloco:b};
    for(const l of b.listas) if(!listaFeita(l.id)) return {tipo:'lista', item:l, bloco:b};
  }
  return null;
}
function stats(C){
  let min=0, aulasOk=0; const dias=new Set();
  for(const a of C.aulas){ const r=P().aulas[a.id]; if(r){ aulasOk++; min+=Number(a.minutos)||0; if(r.data) dias.add(toISO(new Date(r.data))); } }
  let listasOk=0, somaPct=0;
  for(const l of C.listas){ const r=listaReg(l.id); if(r&&r.tentativas&&r.tentativas.length){ listasOk++; min+=Number(l.minutos)||0; somaPct+=melhorPct(l.id); r.tentativas.forEach(t=>dias.add(toISO(new Date(t.data)))); } }
  const total = C.aulas.length + C.listas.length;
  const datas=[...dias].sort();
  return {aulasOk, totalAulas:C.aulas.length, listasOk, totalListas:C.listas.length, min, dias:dias.size, media: listasOk? somaPct/listasOk : null,
          pct: total? Math.round((aulasOk+listasOk)/total*100) : 0, primeira:datas[0]||null, ultima:datas[datas.length-1]||null};
}
// Sequência de dias seguidos de estudo (domingo não quebra a sequência)
function sequencia(){
  const dias=new Set(); const p=P();
  Object.values(p.aulas).forEach(r=>r&&r.data&&dias.add(toISO(new Date(r.data))));
  Object.values(p.listas).forEach(r=>(r.tentativas||[]).forEach(t=>dias.add(toISO(new Date(t.data)))));
  let n=0; const d=new Date();
  if(!dias.has(toISO(d))){ d.setDate(d.getDate()-1); if(d.getDay()===0) d.setDate(d.getDate()-1); }
  while(dias.has(toISO(d))){ n++; d.setDate(d.getDate()-1); if(d.getDay()===0) d.setDate(d.getDate()-1); }
  return {n, hoje:dias.has(hojeISO())};
}
function contarNumeros(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  $$('[data-contar]').forEach(el=>{ const alvo=parseFloat(el.dataset.contar); if(!(alvo>0)) return; const dec=el.dataset.dec?1:0, t0=performance.now(), dur=800;
    const passo=t=>{ const k=Math.min(1,(t-t0)/dur), v=alvo*(1-Math.pow(1-k,3)); el.textContent=dec?nf1.format(v):Math.round(v); if(k<1) requestAnimationFrame(passo); else el.textContent=dec?nf1.format(alvo):alvo; };
    requestAnimationFrame(passo); });
}
function confete(origem){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const r=origem? origem.getBoundingClientRect() : {left:innerWidth/2,top:innerHeight/2,width:0,height:0};
  const x=r.left+r.width/2, y=r.top+r.height/2, cores=['#c9a24a','#e0c27a','#0b1f4d','#1e9e5a','#1d3f8a','#f3e2b0'];
  for(let i=0;i<46;i++){ const c=document.createElement('i'); c.className='confete';
    const ang=Math.random()*Math.PI*2, dist=90+Math.random()*190;
    c.style.cssText=`left:${x}px;top:${y}px;background:${cores[i%cores.length]};--dx:${Math.cos(ang)*dist}px;--dy:${Math.sin(ang)*dist-80}px;--r:${Math.random()*720-360}deg;animation-delay:${Math.random()*.08}s`;
    document.body.appendChild(c); setTimeout(()=>c.remove(),1500); }
}
function temProgresso(){ const p=P(); return Object.keys(p.aulas).length>0 || Object.keys(p.listas).length>0 || Object.keys(p.notas).length>0; }

async function enviarLogin(e){
  e.preventDefault();
  const msg=$('#l-msg'), btn=$('#l-btn');
  const erro=t=>{ msg.innerHTML=`<div class="alert alert-err">${esc(t)}</div>`; }, okm=t=>{ msg.innerHTML=`<div class="alert alert-ok">${esc(t)}</div>`; };
  const email=($('#l-email')?$('#l-email').value:'').trim().toLowerCase(), p=$('#l-pass')?$('#l-pass').value:'', p2=$('#l-pass2')?$('#l-pass2').value:'';
  btn.disabled=true;
  try{
    if(modoLogin==='esqueci'){
      if(!emailOk(email)) return erro('Digite um e-mail válido.');
      await authReq('/recover'+redirQ(),{body:{email}});
      return okm('Pronto! Se esse e-mail tiver conta, enviamos um link para criar uma nova senha. Olhe também a caixa de spam.');
    }
    if(modoLogin==='nova'){
      if(p.length<6) return erro('A senha precisa ter pelo menos 6 caracteres.');
      if(p!==p2) return erro('As duas senhas não são iguais.');
      await authReq('/user',{method:'PUT', token:sessRecuperacao.access_token, body:{password:p}});
      const sess=sessRecuperacao; sessRecuperacao=null; toast('Senha trocada! Você já está dentro.','ok'); await iniciarSessao(sess, p); return;
    }
    if(!emailOk(email)) return erro('Digite um e-mail válido.');
    if(modoLogin==='criar'){
      if(p.length<6) return erro('A senha precisa ter pelo menos 6 caracteres.');
      if(p!==p2) return erro('As duas senhas não são iguais.');
      const j=await authReq('/signup'+redirQ(),{body:{email,password:p}});
      if(j.access_token && j.user){ await iniciarSessao(sessaoDe(j), p); toast('Conta criada! Bem-vindo(a) ao Curso Fiscal.','ok'); return; }
      const u=j.user||j;
      if(Array.isArray(u.identities) && u.identities.length===0) return erro('Este e-mail já tem conta. Clique em "Entrar".');
      modoLogin='entrar'; mostrarLogin(); $('#l-email').value=email;
      $('#l-msg').innerHTML='<div class="alert alert-ok"><b>Conta criada!</b> Enviamos um e-mail para confirmar o seu endereço. Abra o e-mail, clique no link e depois volte aqui para entrar.</div>'; return;
    }
    const j=await authReq('/token?grant_type=password',{body:{email,password:p}});
    await iniciarSessao(sessaoDe(j), p);
  }catch(err){ erro(msgErro(err)); }
  finally{ btn.disabled=false; }
}
async function sair(){
  if(!await confirmar({titulo:'Sair do sistema?', texto:'Seu progresso continua salvo na sua conta online.', ok:'Sair'})) return;
  clearTimeout(syncTimer);
  for(let i=0;i<3 && localStorage.getItem(kSujo(S.user))==='1';i++){ while(enviando) await new Promise(r=>setTimeout(r,100)); await enviarNuvem(); }
  const pendente = localStorage.getItem(kSujo(S.user))==='1';
  if(pendente && !await confirmar({titulo:'Há alterações que ainda não foram para a nuvem', texto:'Parece que você está sem internet. Se sair agora, as últimas alterações ficam só neste aparelho e vão para a nuvem na próxima vez que você entrar aqui com internet. Sair mesmo assim?', ok:'Sair mesmo assim', cancelar:'Ficar', perigo:true})) { agendarEnvio(); return; }
  try{ if(SESS) await authReq('/logout',{token:SESS.access_token}); }catch(e){}
  sairLocal(!pendente);
}
// Link recebido por e-mail (confirmação de conta ou nova senha)
async function tratarLinkEmail(){
  const h=location.hash.replace(/^#/,''); if(!/(access_token=|error_code=|error=)/.test(h)) return false;
  const q=new URLSearchParams(h); history.replaceState(null,'',location.pathname+location.search);
  if(q.get('error')||q.get('error_code')){ toast(q.get('error_code')==='otp_expired'?'Esse link expirou ou já foi usado. Peça um novo.':'Não foi possível usar o link do e-mail.','err'); return false; }
  const tk=q.get('access_token'); if(!tk) return false;
  try{
    const u=await authReq('/user',{method:'GET', token:tk});
    const sess={access_token:tk, refresh_token:q.get('refresh_token')||'', expires_at:Number(q.get('expires_at'))||Math.floor(Date.now()/1000)+(Number(q.get('expires_in'))||3600), user:{id:u.id,email:u.email}};
    if(q.get('type')==='recovery'){ sessRecuperacao=sess; modoLogin='nova'; return true; }
    await iniciarSessao(sess); toast('E-mail confirmado! Bem-vindo(a).','ok'); return true;
  }catch(e){ toast(msgErro(e),'err'); return false; }
}

// Converte número digitado (aceita vírgula ou ponto). Devolve as leituras possíveis.
function leiturasNumero(txt){
  let s=String(txt||'').replace(/R\$|%|\s/gi,''); if(!s) return [];
  const out=new Set();
  if(s.includes(',')){ out.add(Number(s.replace(/\./g,'').replace(',','.'))); }
  else { out.add(Number(s)); if(/^-?\d{1,3}(\.\d{3})+$/.test(s)) out.add(Number(s.replace(/\./g,''))); }
  return [...out].filter(n=>isFinite(n));
}

/* ---------- 15. IMPORTAR CONTEÚDO (validação do JSON) ---------- */
function extrairJSON(txt){
  let s=String(txt||'').trim();
  const cerca=/```(?:json|JSON)?\s*([\s\S]*?)```/.exec(s); if(cerca) s=cerca[1].trim();
  try{ return JSON.parse(s); }catch(e){
    const i=s.indexOf('{'), j=s.lastIndexOf('}');
    if(i>=0&&j>i){ try{ return JSON.parse(s.slice(i,j+1)); }catch(e2){} }
    const m=/position (\d+)/.exec(e.message); let onde='';
    if(m){ const pos=+m[1], linha=s.slice(0,pos).split('\n').length; onde=` (perto da linha ${linha})`; }
    throw new Error('O texto colado não é um JSON válido'+onde+'. Confira se copiou o bloco inteiro, do primeiro "{" ao último "}".');
  }
}
const txt = v => typeof v==='string' ? v : (Array.isArray(v) ? v.filter(x=>typeof x==='string').join('\n') : (v==null?'':String(v)));
const IDOK = /^[A-Za-z0-9_.-]{1,30}$/;
/* Valida o bloco. Devolve {bloco limpo|null, erros[], avisos[]}. Itens com erro são ignorados, o resto é importado. */
function validarBloco(j){
  const erros=[], avisos=[];
  if(!j || typeof j!=='object' || Array.isArray(j)) return {bloco:null, erros:['O conteúdo precisa ser um objeto JSON com "bloco", "aulas" e "listas".'], avisos};
  const b=j.bloco;
  if(!b || typeof b!=='object') return {bloco:null, erros:['Falta o campo "bloco" (com id, titulo, inicio e fim).'], avisos};
  const bid=String(b.id||'').trim();
  if(!bid) erros.push('Bloco: falta o "id" (ex.: "B01").'); else if(!IDOK.test(bid)) erros.push(`Bloco: o id "${bid}" tem caracteres inválidos. Use letras, números, hífen ou ponto.`);
  const titulo=String(b.titulo||'').trim(); if(!titulo) avisos.push('Bloco: falta o "titulo". Usei o id como título.');
  if(erros.length) return {bloco:null, erros, avisos};
  // IDs de aulas já usados em OUTROS blocos
  const usados={}; for(const ob of Object.values(S.blocos)){ if(ob.bloco.id===bid) continue; ob.aulas.forEach(a=>usados[a.id]=ob.bloco.id); ob.listas.forEach(l=>usados['L:'+l.id]=ob.bloco.id); }
  const aulas=[], idsA=new Set(), dias=new Set();
  if(!Array.isArray(j.aulas)||!j.aulas.length) erros.push('Falta a lista "aulas" (ou ela está vazia).');
  (Array.isArray(j.aulas)?j.aulas:[]).forEach((a,n)=>{
    const ref=`Aula ${n+1}${a&&a.id?` (${a.id})`:''}`;
    if(!a||typeof a!=='object'){ erros.push(`${ref}: formato inválido. Aula ignorada.`); return; }
    const id=String(a.id||'').trim(), e=[];
    if(!id) e.push('falta o "id"'); else if(!IDOK.test(id)) e.push(`o id "${id}" tem caracteres inválidos`); else if(idsA.has(id)) e.push(`o id "${id}" está repetido`); else if(usados[id]) e.push(`o id "${id}" já é usado no bloco ${usados[id]}`);
    const dia=Number(a.dia); if(!Number.isInteger(dia)||dia<1) e.push('o "dia" (número da aula) deve ser 1, 2, 3...'); else if(dias.has(dia)) e.push(`a aula número ${dia} está repetida`);
    const disc=String(a.disciplina||'').trim().toUpperCase(); if(!DISCIPLINAS[disc]) e.push(`disciplina "${a.disciplina??''}" não existe (use D01 a D12)`);
    const tit=String(a.titulo||'').trim(); if(!tit) e.push('falta o "titulo"');
    if(e.length){ erros.push(`${ref}: ${e.join('; ')}. Aula ignorada.`); return; }
    idsA.add(id); dias.add(dia);
    let min=Number(a.minutos); if(!(min>0)){ min=30; avisos.push(`${ref}: "minutos" ausente ou inválido. Usei 30.`); }
    const roteiro=(Array.isArray(a.roteiro)?a.roteiro:[]).filter(r=>r&&typeof r==='object').map(r=>({min:Number(r.min)||0, etapa:String(r.etapa||'')}));
    const somaR=roteiro.reduce((s,r)=>s+r.min,0); if(roteiro.length && somaR!==min) avisos.push(`${ref}: o roteiro soma ${somaR} min, mas a aula tem ${min} min.`);
    if(!txt(a.conteudo).trim()) avisos.push(`${ref}: o "conteudo" está vazio.`);
    // Vídeo
    let video=null;
    if(a.video!=null){
      const v=a.video;
      if(typeof v!=='object'){ erros.push(`${ref}: "video" em formato inválido. O vídeo foi ignorado.`); }
      else if(v.link!=null && String(v.link).trim()!==''){
        const u=linkSeguro(v.link);
        if(!u) erros.push(`${ref}: link de vídeo inválido ("${String(v.link).slice(0,80)}"). Só aceito links que começam com http:// ou https://. O vídeo foi ignorado.`);
        else video={titulo:String(v.titulo||'Videoaula'), canal:String(v.canal||''), duracao:String(v.duracao||''), link:u, atencao:String(v.atencao||'')};
      } else if(String(v.busca||'').trim()) video={busca:String(v.busca).trim().slice(0,200)};
      else avisos.push(`${ref}: "video" sem link e sem busca. Ignorado.`);
    }
    aulas.push({id, dia, disciplina:disc, titulo:tit, objetivo:txt(a.objetivo), minutos:min, roteiro,
      conteudo:txt(a.conteudo), exemplo:txt(a.exemplo), naPratica:txt(a.naPratica??a.na_pratica), armadilhas:txt(a.armadilhas),
      base_legal:(Array.isArray(a.base_legal)?a.base_legal:(a.base_legal?[a.base_legal]:[])).map(String).filter(s=>s.trim()),
      caderno:(Array.isArray(a.caderno)?a.caderno:(a.caderno?[a.caderno]:[])).map(String).filter(s=>s.trim()), video});
  });
  if(!aulas.length){ erros.push('Nenhuma aula válida. O bloco não foi importado.'); return {bloco:null, erros, avisos}; }
  // Listas
  const listas=[], idsL=new Set();
  if(j.listas!=null && !Array.isArray(j.listas)) erros.push('"listas" deve ser uma lista [ ].');
  (Array.isArray(j.listas)?j.listas:[]).forEach((l,n)=>{
    const ref=`Lista ${n+1}${l&&l.id?` (${l.id})`:''}`;
    if(!l||typeof l!=='object'){ erros.push(`${ref}: formato inválido. Lista ignorada.`); return; }
    const id=String(l.id||'').trim();
    if(!id||!IDOK.test(id)){ erros.push(`${ref}: falta um "id" válido. Lista ignorada.`); return; }
    if(idsL.has(id)||usados['L:'+id]){ erros.push(`${ref}: o id "${id}" já está em uso. Lista ignorada.`); return; }
    let qs=Array.isArray(l.questoes)?l.questoes:[];
    if(qs.length>10){ avisos.push(`${ref}: tem ${qs.length} questões. O limite é 10; usei só as 10 primeiras.`); qs=qs.slice(0,10); }
    const questoes=[];
    qs.forEach((q,k)=>{
      const qr=`${ref}, questão ${k+1}`;
      if(!q||typeof q!=='object'){ erros.push(`${qr}: formato inválido. Ignorada.`); return; }
      const tipo=String(q.tipo||'').toLowerCase().replace('múltipla','multipla').replace('cálculo','calculo');
      const enun=txt(q.enunciado).trim(); if(!enun){ erros.push(`${qr}: falta o "enunciado". Ignorada.`); return; }
      const expl=txt(q.explicacao);
      if(tipo==='multipla'){
        const op=Array.isArray(q.opcoes)?q.opcoes.map(x=>String(x??'')).filter(x=>x.trim()):[];
        const c=Number(q.correta);
        if(op.length<2){ erros.push(`${qr}: múltipla escolha precisa de pelo menos 2 opções. Ignorada.`); return; }
        if(op.length>10){ erros.push(`${qr}: no máximo 10 opções. Ignorada.`); return; }
        if(!Number.isInteger(c)||c<0||c>=op.length){ erros.push(`${qr}: "correta" deve ser o número da opção certa, começando em 0 (de 0 a ${op.length-1}). Ignorada.`); return; }
        questoes.push({tipo, enunciado:enun, opcoes:op, correta:c, explicacao:expl});
      } else if(tipo==='calculo'){
        const r=typeof q.resposta==='number'?q.resposta:leiturasNumero(q.resposta)[0];
        if(!isFinite(r)){ erros.push(`${qr}: "resposta" deve ser um número. Ignorada.`); return; }
        let tol=Number(q.tolerancia); if(!(tol>=0)) tol=0.01;
        questoes.push({tipo, enunciado:enun, resposta:r, tolerancia:tol, unidade:String(q.unidade||''), explicacao:expl});
      } else if(tipo==='discursiva'){
        const gab=txt(q.gabarito).trim(); if(!gab){ erros.push(`${qr}: discursiva precisa de "gabarito" (resposta-modelo). Ignorada.`); return; }
        questoes.push({tipo, enunciado:enun, gabarito:gab, explicacao:expl});
      } else { erros.push(`${qr}: tipo "${q.tipo??''}" desconhecido (use multipla, calculo ou discursiva). Ignorada.`); }
    });
    if(!questoes.length){ erros.push(`${ref}: nenhuma questão válida. Lista ignorada.`); return; }
    let refs=Array.isArray(l.aulas)?l.aulas.map(String):[];
    const faltam=refs.filter(x=>!idsA.has(x)); if(faltam.length) avisos.push(`${ref}: aulas não encontradas neste bloco: ${faltam.join(', ')}.`);
    refs=refs.filter(x=>idsA.has(x)); if(!refs.length) refs=aulas.map(a=>a.id);
    let min=Number(l.minutos); if(!(min>0)) min=30;
    idsL.add(id);
    listas.push({id, titulo:String(l.titulo||'').trim()||('Lista '+id), aulas:refs, minutos:min, questoes});
  });
  if(!listas.length) avisos.push('Este bloco não tem lista de exercícios válida.');
  return {bloco:{bloco:{id:bid, titulo:titulo||bid}, aulas, listas, importadoEm:new Date().toISOString()}, erros, avisos};
}

  if(!S.admin){ toast('Só o administrador pode importar conteúdo.','err'); return false; }

  S.blocos[id]=r.bloco; guardarConteudoLocal();
  ultimoResultado=`<div class="alert alert-ok"><b>Bloco ${esc(id)} ${existe?'atualizado':'importado'}!</b> ${plural(r.bloco.aulas.length,'aula','aulas')} e ${plural(r.bloco.listas.length,'lista','listas')}.${r.erros.length?' Alguns itens com erro foram ignorados.':''}</div>`

function cpfValido(c){
  c=String(c||'').replace(/\D/g,''); if(c.length!==11||/^(\d)\1{10}$/.test(c)) return false;
  for(let t=9;t<11;t++){ let s=0; for(let i=0;i<t;i++) s+=+c[i]*(t+1-i); const d=((s*10)%11)%10; if(d!==+c[t]) return false; }
  return true;
}
function mascaraCPF(v){ const d=String(v||'').replace(/\D/g,'').slice(0,11); return d.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2'); }
function perfilCompleto(){ const p=S.d.perfil; return p.nome.trim().split(/\s+/).length>=2 && cpfValido(p.cpf) && !!parseISO(p.nascimento); }
function requisitos(C, st){
  return [
    {ok: st.totalAulas>0 && st.aulasOk===st.totalAulas, t:'Todas as aulas concluídas', d:`${st.aulasOk} de ${st.totalAulas}`, link:'#/curso'},
    {ok: st.totalListas>0 && st.listasOk===st.totalListas, t:'Todas as listas de exercícios feitas', d:`${st.listasOk} de ${st.totalListas}`, link:'#/exercicios'},
    {ok: perfilCompleto(), t:'Perfil completo (nome completo, CPF válido e data de nascimento)', d:perfilCompleto()?'ok':'falta completar', link:'#/perfil'},
    {ok: !!S.d.config.cursoTerminou, t:'Você marcou que o curso terminou', d:'', link:null}
  ];
}
function dadosCert(C, st){
  const c=certCfg(), p=S.d.perfil;
  const discs=Object.entries(DISCIPLINAS).map(([cod,d])=>{ const as=C.aulas.filter(a=>a.disciplina===cod&&aulaFeita(a.id)); return {cod, nome:d.nome, comp:d.comp, aulas:as.length, min:as.reduce((s,a)=>s+(Number(a.minutos)||0),0)}; });
  const minListas=C.listas.filter(l=>listaFeita(l.id)).reduce((s,l)=>s+(Number(l.minutos)||0),0);
  return {curso:c.curso, sub:c.subtitulo, inst:c.instituicao, mostrarCpf:c.mostrarCpf, pag2:c.segundaPagina,
    nome:p.nome.trim()||contaAtual().usuario, cpf:mascaraCPF(p.cpf), horas:horas(st.min), aulas:st.aulasOk, listas:st.listasOk,
    media: st.media==null?0:Math.round(st.media), ini: st.primeira?fmtData(st.primeira):'—', fim: st.ultima?fmtData(st.ultima):'—',
    emissao: fmtData(hojeISO()), discs, minListas, minTotal:st.min};
}
async function codigoVerif(D){
  const h=(await sha256Hex([D.nome,D.cpf,D.curso,D.horas,D.aulas,D.listas,D.media,D.ini,D.fim,D.emissao].join('|'))).toUpperCase();
  return 'CF-'+h.slice(0,4)+'-'+h.slice(4,8)+'-'+h.slice(8,12);
}

async function posCertificado(C, st){
  const D=dadosCert(C,st), pronto=requisitos(C,st).every(r=>r.ok), cod=await codigoVerif(D);
  const el=$('#cert-prev'); if(!el) return;
  const pags=paginasCert(D,cod,!pronto,'tela');
  el.innerHTML = pags.split('<div class="cert-page">').filter(Boolean).map(p=>`<div class="cert-wrap"><div class="cert-scale"><div class="cert-page">${p}</div></div>`).join('');

function ajustarEscala(){
  $$('.cert-wrap').forEach(w=>{ const s=Math.min(1, w.clientWidth/1122.52); const sc=w.firstElementChild; sc.style.transform=`scale(${s})`; w.style.height=(793.7*s)+'px'; });
}
async function gerarPDF(){
  const C=curso(), st=stats(C); if(!requisitos(C,st).every(r=>r.ok)) return toast('Ainda faltam requisitos para emitir o certificado.','err');
  const D=dadosCert(C,st), cod=await codigoVerif(D);
  $('#print-root').innerHTML=paginasCert(D,cod,false,'imp');
  try{ await document.fonts.ready; }catch(e){}
  imprimir('@page{size:A4 landscape;margin:0}');
}

function baixarBackup(){

  const blob=new Blob([JSON.stringify(pacote,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`backup-curso-fiscal-${S.email.replace(/[^a-z0-9._-]/gi,'_')}-${hojeISO()}.json`;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);

async function restaurarArquivo(file){
  let pk; try{ pk=JSON.parse(await file.text()); }catch(e){ return toast('Esse arquivo não é um backup válido.','err'); }
  if(!pk || pk.app!=='curso-fiscal' || !pk.dados) return toast('Esse arquivo não é um backup do Curso Fiscal.','err');
  if(!S.user) return;
  if(!await confirmar({titulo:'Restaurar backup', texto:`Os dados atuais da sua conta serão substituídos pelos do backup de ${fmtData(pk.exportadoEm)}. Eles também vão para a nuvem.`, ok:'Substituir meus dados', perigo:true})) return;
  const novo=normalizar(pk.dados); if(!S.admin) novo.blocos={}; else if(pk.blocosDoCurso) Object.assign(novo.blocos, pk.blocosDoCurso); S.d=novo; S.tentativa=null; salvar(); if(S.admin){ try{ await publicarBlocosAntigos(); }catch(e){} } toast('Backup restaurado com sucesso.','ok'); ir('#/painel');
}

  if(n1!==n2) return erro('As duas senhas novas não são iguais.');

/* ---------- 21. MANUAL DO FISCAL ----------
   O conteúdo fica no arquivo "manual.dat", ao lado do index.html, criptografado (AES-GCM).
   A chave está no Supabase e só é entregue ao administrador ou, quando ele liberar, aos alunos logados.
   Assim o repositório público do GitHub não expõe nada. */
const MAN_SECOES = [
  ['questor','Questor (Operação)','questor'],['declaracoes','Declarações e obrigações','decl'],['tributos','Tributos e cálculos','trib'],
  ['iss','ISS municipal','iss'],['parcelamentos','Parcelamentos e retificações','parc'],['rotinas','Rotinas e ferramentas','rot'],
  ['clientes','Particularidades por cliente','cli'],['consultas','Tabelas de consulta','tab']
];
const MAN = { dados:null, carregando:null, erro:null, busca:'' };
const manualLiberado = () => S.admin || !!(S.certGeral && S.certGeral.manualAlunos);
async function carregarManual(){
  if(MAN.dados) return MAN.dados;
  if(MAN.carregando) return MAN.carregando;
  MAN.erro=null;
  MAN.carregando=(async()=>{
    try{
      const k=await restReq('/curso_segredos?select=valor&id=eq.manual_v1');
      if(!k||!k.length) throw {semAcesso:true};
      const chave=await crypto.subtle.importKey('raw', unb64(k[0].valor), {name:'AES-GCM'}, false, ['decrypt']);
      let r; try{ r=await fetch('manual.dat',{cache:'no-cache'}); }catch(e){ throw {semArquivo:true}; }
      if(!r.ok) throw {semArquivo:true};
      const buf=new Uint8Array(await r.arrayBuffer());
      const gz=await crypto.subtle.decrypt({name:'AES-GCM', iv:buf.slice(0,12)}, chave, buf.slice(12));
      const txt=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
      const d=JSON.parse(txt);
      MAN.base={artigos:d.artigos, tabelas:d.tabelas};
      MAN.dados=d; MAN.ed={};
      try{ (await restReq('/curso_manual_edicoes?select=id,dados')||[]).forEach(r=>MAN.ed[r.id]=r.dados||{}); }catch(e){}
      aplicarEdicoes();
      return MAN.dados;
    }catch(e){ MAN.erro=e; throw e; }
    finally{ MAN.carregando=null; }
  })();
  return MAN.carregando;
}
/* Edições do administrador: ficam no Supabase e valem para todos; o manual.dat original não muda. */
const DIAS_LIXEIRA = 10;
function aplicarEdicoes(){
  const D=MAN.dados, ed=MAN.ed||{};
  const fotosDe=e=>(e&&Array.isArray(e.fotos)?e.fotos:[]).filter(f=>f&&/^data:image\/(webp|jpeg|png);base64,/.test(f.src));
  const todos=[];
  for(const a of MAN.base.artigos){
    const e=ed[a.id]; if(e&&e.excluido) continue;
    const rem=new Set((e&&e.imgsRemovidas)||[]);
    todos.push(Object.assign({}, a, e&&e.titulo!=null?{titulo:e.titulo}:{}, e&&e.resumo!=null?{resumo:e.resumo}:{}, e&&e.corpo!=null?{corpo:e.corpo}:{},
      e&&e.avisoOculto?{aviso:null, _avisoOculto:true}:{}, {imgs:(a.imgs||[]).map((im,k)=>Object.assign({},im,{_k:k})).filter(im=>!rem.has(im._k)), fotos:fotosDe(e), _editado:!!e, _removido:!!(e&&e.removido), _removidoEm:e&&e.removidoEm}));
  }
  // conteúdos novos criados pelo administrador (ficam no fim da seção, na ordem de criação)
  Object.entries(ed).filter(([id,e])=>e&&e.novo&&!e.excluido).sort((x,y)=>String(x[1].criadoEm||'').localeCompare(String(y[1].criadoEm||'')))
    .forEach(([id,e])=>todos.push({id, sec:e.sec, titulo:e.titulo||'Sem título', resumo:e.resumo||'', corpo:e.corpo||'', imgs:[], fotos:fotosDe(e), _novo:true, _editado:true, _removido:!!e.removido, _removidoEm:e.removidoEm, _criadoEm:e.criadoEm}));
  D.artigos=todos.filter(a=>!a._removido); D.artigosRemovidos=todos.filter(a=>a._removido);
  D.porId={}; todos.forEach(a=>D.porId[a.id]=a);
  const tabs=MAN.base.tabelas.filter(t=>!(ed[t.id]&&ed[t.id].excluido)).map(t=>Object.assign({},t,{_removido:!!(ed[t.id]&&ed[t.id].removido), _removidoEm:ed[t.id]&&ed[t.id].removidoEm}));
  D.tabelas=tabs.filter(t=>!t._removido); D.tabelasRemovidas=tabs.filter(t=>t._removido);
  D.tabPorId={}; tabs.forEach(t=>D.tabPorId[t.id]=t);
}

  else { await restReq('/curso_manual_edicoes?on_conflict=id',{method:'POST', prefer:'resolution=merge-duplicates,return=minimal', body:{id, dados, atualizado_em:new Date().toISOString()}}); MAN.ed[id]=dados; }

}

function comprimirFoto(file){

    if(!/^image\//.test(file.type)) return rej(new Error('tipo'));

function inserirNoTexto(antes, depois, padrao, blocoLinha){
  const t=$('#e-corpo'); if(!t) return; let a=t.selectionStart, b=t.selectionEnd; const v=t.value;
  if(blocoLinha){ // aplica no começo de cada linha selecionada (ou da linha do cursor)
    const ini=v.lastIndexOf('\n',a-1)+1; let fim=v.indexOf('\n',Math.max(a,b-1)); if(fim<0) fim=v.length; if(b>a&&v[b-1]==='\n') fim=b-1;
    const trecho=v.slice(ini,fim), vazio=!trecho.trim();
    const linhas=(vazio?padrao:trecho).split('\n'), feito=linhas.map((l,n)=>blocoLinha(l,n)).join('\n');
    t.value=v.slice(0,ini)+feito+v.slice(fim); t.focus();
    if(vazio){ const pref=feito.length-padrao.length; t.setSelectionRange(ini+pref, ini+feito.length); }   // seleciona o texto de exemplo: é só digitar por cima
    else t.setSelectionRange(ini+feito.length, ini+feito.length);
  } else if(padrao===null){ // insere no cursor, sem envolver a seleção (fotos, linha, tabela)
    t.value=v.slice(0,b)+antes+v.slice(b); t.focus(); t.setSelectionRange(b+antes.length, b+antes.length);
  } else {
    const sel=v.slice(a,b)||padrao||''; t.value=v.slice(0,a)+antes+sel+depois+v.slice(b); t.focus();
    if(b>a) t.setSelectionRange(a+antes.length+sel.length+depois.length, a+antes.length+sel.length+depois.length);
    else t.setSelectionRange(a+antes.length, a+antes.length+sel.length);
  }
  atualizarPrevia();
}
function formatar(f){
  const L=s=>s.replace(/^(#{1,6}\s+|[-*]\s+|\d+[.)]\s+|>\s?)/,'');
  switch(f){
    case 'b': return inserirNoTexto('**','**','texto em negrito');
    case 'i': return inserirNoTexto('*','*','texto em itálico');
    case 'mark': return inserirNoTexto('==','==','texto destacado');
    case 'h2': return inserirNoTexto('','', 'Título', l=>'## '+L(l));
    case 'h3': return inserirNoTexto('','', 'Subtítulo', l=>'### '+L(l));
    case 'ul': return inserirNoTexto('','', 'item', l=>'- '+L(l));
    case 'ol': return inserirNoTexto('','', 'passo', (l,n)=>(n+1)+'. '+L(l));
    case 'quote': return inserirNoTexto('','', 'Atenção: ...', l=>'> '+L(l));
    case 'code': return inserirNoTexto('`','`','W:\\Fiscal\\...');
    case 'hr': return inserirNoTexto('\n---\n','',null);
    case 'table': return inserirNoTexto('\n| Coluna 1 | Coluna 2 |\n|---|---|\n| valor | valor |\n','',null);
    case 'link': { const u=prompt('Endereço do link (começando com https://)','https://'); if(!u||!/^https?:\/\/\S+$/.test(u)) return; return inserirNoTexto('[','](' + u + ')','texto do link'); }
    case 'foto': EDT._inserir=true; return $('#e-file').click();
  }
}

  <div class="card lesson-nav">${ant?`<a class="btn" href="#/artigo/${encodeURIComponent(ant.id)}">← ${esc(ant.titulo.length>34?ant.titulo.slice(0,32)+'…':ant.titulo)}</a>`:`<a class="btn" href="#/manual/${s.id}">← ${esc(s.titulo)}</a>`}

const TABF = {};     // filtro de cada tabela: {col, ord, dir}
function filtrarTabela(t, q){
  const f=TABF[t.id]||(TABF[t.id]={col:-1, ord:-1, dir:1});
  const tq=semAcento(q.trim());
  let linhas = !tq ? t.linhas.slice() : t.linhas.filter(l=> f.col<0 ? semAcento(l.join(' | ')).includes(tq) : semAcento(l[f.col]).includes(tq));
  if(f.ord>=0){ const k=f.ord, num=v=>{ const n=Number(String(v).replace(/\./g,'').replace(',','.')); return isFinite(n)&&String(v).trim()!==''?n:null; };
    linhas.sort((a,b)=>{ const x=num(a[k]), y=num(b[k]); const r=(x!=null&&y!=null)?x-y:String(a[k]).localeCompare(String(b[k]),'pt-BR',{numeric:true}); return r*f.dir; }); }
  const max=300, mostra=linhas.slice(0,max);
  const realcaCol=(c,i)=> (f.col<0||f.col===i) ? realce(c,q.trim()) : esc(c);
  return `<p class="small muted">${tq?`${nfInt.format(linhas.length)} de ${nfInt.format(t.linhas.length)} linhas`:`${nfInt.format(t.linhas.length)} linhas`}${f.col>=0&&tq?` · buscando só em "${esc(t.colunas[f.col])}"`:''}${linhas.length>max?` · mostrando as ${max} primeiras, refine a busca`:''}</p>
  <div class="tab-wrap"><table><thead><tr>${t.colunas.map((c,i)=>`<th data-action="tab-ordenar" data-tab="${esc(t.id)}" data-i="${i}" style="cursor:pointer;white-space:nowrap" title="Ordenar por esta coluna">${esc(c)} <span style="opacity:${f.ord===i?1:.35}">${f.ord===i?(f.dir>0?'▲':'▼'):'⇅'}</span></th>`).join('')}</tr></thead><tbody>${mostra.map(l=>`<tr>${l.map((c,i)=>`<td>${realcaCol(c,i)}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${t.colunas.length}" class="muted">Nenhuma linha encontrada.</td></tr>`}</tbody></table></div>`;
}

}
function abrirImagem(lista, k, titulo){
  const bg=document.createElement('div'); bg.className='lightbox';
  const mostra=()=>{ bg.innerHTML=`<div class="barra"><span>${esc(titulo)} · ${k+1} de ${lista.length}${lista[k].legenda?' · '+esc(lista[k].legenda):''}</span><span style="display:flex;gap:.5rem">${lista.length>1?'<button data-l="-1">‹</button><button data-l="1">›</button>':''}<button data-l="x">Fechar ✕</button></span></div><div class="area"><img src="${lista[k].src}" alt=""></div>`; };
  mostra(); document.body.appendChild(bg); document.body.style.overflow='hidden';
  const fechar=()=>{ bg.remove(); document.body.style.overflow=''; document.removeEventListener('keydown',tecla); };
  const tecla=e=>{ if(e.key==='Escape') fechar(); if(e.key==='ArrowRight'&&lista.length>1){k=(k+1)%lista.length;mostra();} if(e.key==='ArrowLeft'&&lista.length>1){k=(k-1+lista.length)%lista.length;mostra();} };
  document.addEventListener('keydown',tecla);
  bg.addEventListener('click',e=>{ const b=e.target.closest('[data-l]');
    if(b){ if(b.dataset.l==='x') return fechar(); k=(k+(+b.dataset.l)+lista.length)%lista.length; mostra(); return; }
    if(e.target.tagName==='IMG'){ e.target.classList.toggle('zoom'); return; }
    if(e.target.classList.contains('area')) fechar(); });
}
